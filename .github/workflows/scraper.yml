name: Check Odyssey Showtimes

on:
  schedule:
    # Runs every 5 minutes
    - cron: "*/5 * * * *"
  workflow_dispatch: # allows you to run it manually from GitHub

permissions:
  contents: write # needed to push the updated known_dates.json

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -r requirements.txt   # or use uv sync if you have pyproject.toml
          uv pip install playwright
          playwright install --with-deps chromium

      - name: Run scraper (single check)
        env:
          ZIP_CODE: ${{ secrets.ZIP_CODE }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          source .venv/bin/activate
          python main.py --once

      - name: Commit updated known_dates.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add known_dates.json
          git diff --staged --quiet || git commit -m "Update known dates [skip ci]"
          git push
